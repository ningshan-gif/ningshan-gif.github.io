---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.settings.title | default: "Ningshan Ma" }}</title>
  <meta name="description" content="Ningshan's room — posts floating in warm light, a Stratocaster, a very good dog.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1a0f07; }
    body { font-family: 'Inter', system-ui, sans-serif; color: #f3e5cf; }
    #room-canvas, #room-canvas canvas { position: fixed; inset: 0; display: block; }

    #room-loading {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #2e1a0c 0%, #150a04 75%);
      transition: opacity .8s ease; text-align: center;
    }
    #room-loading.done { opacity: 0; pointer-events: none; }
    #room-loading h1 { font-family: 'Darker Grotesque', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: .5px; color: #ffd9a0; }
    #room-loading p { margin-top: 8px; color: #c9a97f; font-size: 14px; }
    #room-loading a { color: #ffd9a0; }
    .lamp-dot { display: inline-block; width: 9px; height: 9px; margin: 18px 4px 0; border-radius: 50%;
      background: #ffc98a; animation: glowdot 1.2s ease-in-out infinite; }
    .lamp-dot:nth-child(2) { animation-delay: .2s; } .lamp-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes glowdot { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

    .hud { position: fixed; z-index: 20; pointer-events: none; }
    #hud-name { top: 26px; left: 30px; }
    #hud-name h1 { font-family: 'Darker Grotesque', sans-serif; font-size: 42px; line-height: 1; font-weight: 800;
      color: #ffe6bd; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
    #hud-name p { margin-top: 4px; font-size: 13px; color: #d9b98c; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
    #hud-links { top: 32px; right: 30px; display: flex; gap: 18px; pointer-events: auto; }
    #hud-links a { color: #f3dcb4; font-size: 14px; font-weight: 500; text-decoration: none;
      padding: 7px 14px; border: 1px solid rgba(255,217,160,.35); border-radius: 999px;
      background: rgba(26,15,7,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: all .2s ease; }
    #hud-links a:hover { background: rgba(255,201,138,.18); border-color: rgba(255,217,160,.7); }
    #room-hint { bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #cfae80;
      background: rgba(26,15,7,.45); padding: 8px 16px; border-radius: 999px;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      text-shadow: 0 1px 8px rgba(0,0,0,.6); white-space: nowrap; }

    #card-tip { position: fixed; z-index: 40; display: none; pointer-events: none; max-width: 300px;
      background: rgba(22,12,5,.92); border: 1px solid rgba(255,217,160,.4); border-radius: 10px;
      padding: 10px 14px; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
    #card-tip strong { display: block; font-size: 14px; font-weight: 600; color: #ffe6bd; line-height: 1.35; }
    #card-tip span { display: block; margin-top: 3px; font-size: 11.5px; color: #c9a97f; }

    @media (max-width: 640px) {
      /* stack the nav pills below the name so they never overlap it */
      #hud-name h1 { font-size: 30px; }
      #hud-name { top: 16px; left: 18px; }
      #hud-links { top: 58px; right: auto; left: 18px; gap: 6px; }
      #hud-links a { font-size: 12px; padding: 5px 10px; }
      #room-hint { font-size: 11px; bottom: 14px; max-width: 92vw; white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="room-canvas"></div>

  <div id="room-loading">
    <div class="load-inner">
      <h1>ningshan&rsquo;s room</h1>
      <p>turning on the warm lights&hellip;</p>
      <div><span class="lamp-dot"></span><span class="lamp-dot"></span><span class="lamp-dot"></span></div>
      <noscript>
        <p>JavaScript is off, so the room stays dark.</p>
        <p><a href="/classic/">enter the classic site &rarr;</a></p>
      </noscript>
    </div>
  </div>

  <div class="hud" id="hud-name">
    <h1>Ningshan Ma</h1>
  </div>
  <div class="hud" id="hud-links">
    <a href="/about/">about</a>
    <a href="/blog/">blog</a>
    <a href="/classic/">classic site</a>
  </div>
  <div class="hud" id="room-hint">drag to look around · scroll to zoom · click any photo to read the post</div>
  <div id="card-tip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/room/main.js"></script>
  <script>
    // If the module (three.js CDN, import maps, old browser) never boots,
    // don't strand the visitor on the loading screen.
    setTimeout(function () {
      if (!window.__room) {
        var el = document.getElementById('room-loading');
        if (el) el.innerHTML =
          '<div class="load-inner"><h1>the room could not load</h1>' +
          '<p>your browser or network could not fetch the 3D bits.</p>' +
          '<p><a href="/classic/">enter the classic site &rarr;</a></p>' +
          '<p><a href="/blog/">blog</a> &middot; <a href="/about/">about</a></p></div>';
      }
    }, 12000);
  </script>
</body>
</html>
