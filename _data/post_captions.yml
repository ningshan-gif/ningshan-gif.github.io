DZ7hqWEm0oN: "I feel in greatest luck to find 知己 across time. I laughed for 10 seconds\
  \ for everything he said.  I said, I find it very hard to imagine to work for a\
  \ company whose mission I absolutely don’t care about working on something I am\
  \ not completely interested in, no matter how much money it pays. If someone spends\
  \ 5/7 or time every week thinking about a problem they did not choose, optimizing\
  \ toward an end goal / objective function defined by someone else (a company), feels\
  \ very much like organ rental / selling your body in some form of Neo-prostitution.\
  \ It’s the same as renting out your brain as a GPU, some form of compute, letting\
  \ a company run its experiments on it during the majority of your waking hours.\n\
  Maybe in exchange one may get 2/7 days of “freedom.” But life is too short, and\
  \ time is too precious. Trading 5/7 of conscious life for 2/7 of autonomy does not\
  \ feel like a good deal, it decided what people grow into. \nA lot of modern job\
  \ structures are residues from the Industrial Revolution, designed to make human\
  \ labor legible, repeatable, measurable, and replaceable. The tragedy is that many\
  \ people have internalized this structure as identity.\n\nI do X, therefore I am\
  \ X.\nI am rewarded for Y, therefore Y is my value.\nI repeat Z every day, therefore\
  \ Z must be who I am.\n\nBut people are not what they repeat. the economic interface\
  \ through which an organization extracts productivity.\n\nWalter said, “People are\
  \ not scared of losing their jobs to AI. They are scared to find out they never\
  \ had one.”\n\nAI threatens the illusion that many jobs were meaningful forms of\
  \ agency in the first place. Maybe it forces people to confront the possibility\
  \ that what they called a career was, in many cases, simply a socially respected\
  \ arrangement for outsourcing their attention, intelligence, and time."
DZrS8RBleym: "I loved riding on these little carts that we used to move robots, and\
  \ I believed that when I up my speed on my electric skateboard i shouldve been able\
  \ to fly given the proper aerodynamics \n\namong these dangerous maneuvers I have\
  \ a tendency to perform also includes trying to stand on a basketball at 5 year\
  \ old, it made sense to me that I should’ve been able to stand on one, seeing how\
  \ those animals in the circus on tv could do it. ended up breaking my arm and having\
  \ a plaster.\n\nover time and many hideous injuries I’ve grown to accept people’s\
  \ accusations of me lacking “common sense” , which might have been true, a lot of\
  \ things that are taken as common sense don’t make sense to me and I definitely\
  \ paid the price for having my own beliefs, yet no one else is injured but me so\
  \ I have the freedom to keep making mistakes and update through all these failure\
  \ modes. perhaps I will always diverge from “common sense” and hurt from breaking\
  \ arm/ knee skin and sometimes heart but what other ways to grow for someone who\
  \ doesn’t know “common sense”"
DZtptVNNVF0: "last dance filmed on mit campus outside my dorm \n\nI started dancing\
  \ extremely late: my senior year at mit. Before then I had never danced or did anything\
  \ similar. I had trouble hearing the beats and I could not move my limbs in the\
  \ desirable way according to expert solution (videos online).\n\nI spent a lot of\
  \ time alone in the dorm studio to learn (it took a lot of reinforcement learning\
  \ / behavioral cloning). with the time I had I didnt publish many papers or get\
  \ things onto my resume but just be able to move my limbs in a not so heinous way,\
  \ sometimes I get questions about whether this skill is reusable or not, since I\
  \ put so much time into it and just set aside all the other things like research\
  \ or classes. if I had invested my time into more AI research perhaps it could’ve\
  \ been more “useful” skill in the future, but ultimately I thought I’m not an agent\
  \ being run by someone or some society, I can decide my own utility function for\
  \ each time step. \n\nI spent so much time learning to dance because I liked the\
  \ people with whom I was dancing with, I realize that for me to work super hard\
  \ and go crazy it’s not a question of what I’m doing but who I’m doing with, if\
  \ I’m working with super passionate inspiring people I can do anything, so always\
  \ searching for these people than a specific problem"
