DNrnz2c4pvg: "This was my last ever dance cover with MIT Asian dance team before I\
  \ graduated, filmed 3 months ago. @mitasiandanceteam \n\nVery thankful of everything,\
  \ all the encounters, and encounter with a new self. \n\nI joined MIT asian dance\
  \ team almost in my last year of college (junior spring) and had never danced before\
  \ that. I remember my legs shaking when I went on stage for the first time, and\
  \ even crying because I can’t hear the beat or do the moves right. There were many\
  \ nice people who helped me, and there was this team that welcomed people even with\
  \ no prior dance experience, and I was able to learn and grow.\n\nI look back in\
  \ my college experience, and deciding to dance was one of the best decisions I could\
  \ have made. For someone who has never danced before, it has been two years since\
  \ I first decided to join the dance team. It gave me a new passion and many friends\
  \ who share it. Because of this, I will keep dancing from now.\n\nThis song is also\
  \ special to me, there’s a line I especially like, “人生 all of nothing, すべて賭けた journey”."
