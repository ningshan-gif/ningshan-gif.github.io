DPun_1Ekrty: "Yesterday, we sold out on the rice cream! \n\nThank you for everyone\
  \ who came \U0001F60A I’ll be back again. Meanwhile please go support @beatice0923\
  \ on weekends in Shinjuku.\n\nFrom the shop, I observed the people walking by. They\
  \ came from somewhere and were heading somewhere. In this intersection, people are\
  \ flowing to different directions, the brief stop and encounter at the shop, maybe\
  \ just 3 minutes with every customer that stopped by, I tried conveyed what was\
  \ most important to me.\n\nWhat is most important to me? I ask myself this many\
  \ times. And I think it is similar to this rice cream shop in the heart of Kabukicho.\
  \ There are so many distractions of flashing and shining things in life, some people\
  \ chase after this, and it’s also admirable. For me, I’m chasing after each small\
  \ moment that I can dedicate my life to, if I can put all of myself into every single\
  \ rice cream, every smile I can give, I want everything that I do to be daring and\
  \ true, even they’re simple and not shining. I found joy in simple things like farming,\
  \ seeing plants turn from seeds and rain into food and into us, then into the Earth\
  \ again, this strange energy that flows, tied everything together. Perhaps, this\
  \ is called love. Through love, I’m learning how to be human. After all, this is\
  \ my first time."
