- code: DYRSP3MKGWt
  caption: '越过山丘

    遇见十九岁的我

    戴着一双白手套

    喝着我的喜酒


    他问我幸福与否

    是否永别了忧愁

    为何婚礼上那么多人

    没有一个当年的朋友


    我说我曾经挽留

    他们纷纷去人海漂流

    那个你深爱的小妞

    嫁了隔壁的王某

    我问她幸福与否

    她哭着点了点头

    后来遇见过那么多人

    想对你说却张不开口


    就让我随你去

    让我随你去

    回到二十岁狂奔的路口

    做个形单影只的歌手


    就让我随你去

    让我随你去

    逆着背影婆娑的人流

    向着那座荒芜的山丘

    挥挥衣袖


    越过山丘

    遇见六十岁的我

    拄着一根白手杖

    在听鸟儿歌唱


    我问他幸福与否

    他笑着摆了摆手

    在他身边围绕着一群

    当年流放归来的朋友


    他说你不必挽留

    爱是一个人的等候

    等到房顶开出了花

    这里就是天下

    总有人幸福白头

    总有人哭着分手

    无论相遇还是不相遇

    都是献给岁月的序曲


    就让我随你去

    让我随你去

    去到六十岁停下的渡口

    等着被一条小船接走


    就让我随你去

    让我随你去

    随着熙熙攘攘的人流

    向着开满鲜花的山丘

    挥挥衣袖'
