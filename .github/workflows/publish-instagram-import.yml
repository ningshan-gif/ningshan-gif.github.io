name: Publish prepared Instagram import
on:
  push:
    branches: [codex/publish-instagram-oct2026]
permissions:
  contents: write
concurrency:
  group: publish-prepared-instagram-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify prepared media
        run: python3 .publish-instagram/fetch.py
      - name: Publish the complete verified tree
        env:
          EXPECTED_BASE: 1722962597ed493f610ff29c8073fad6b510c677
        run: |
          set -euo pipefail
          expected_tree=$(cat .publish-instagram/expected-tree)
          git add images/instagram images/otonoori
          git rm -r .publish-instagram
          git diff --cached --check
          test "$(git write-tree)" = "$expected_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Instagram posts and complete Otonoori archive'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git push origin HEAD:main
