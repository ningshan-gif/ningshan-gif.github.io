<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>· · ·</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #05070f; }
    body { font-family: 'Inter', system-ui, sans-serif; color: #dfe6f2; }
    #room-canvas, #room-canvas canvas { position: fixed; inset: 0; display: block; }
    .hud { position: fixed; z-index: 20; pointer-events: none; }
    #hud-name { top: 24px; left: 28px; }
    #hud-name h1 { font-family: 'Darker Grotesque', sans-serif; font-size: 38px; font-weight: 800;
      color: #bcd0f2; text-shadow: 0 0 24px rgba(120,160,255,.45); }
    #hud-links { top: 30px; right: 28px; pointer-events: auto; }
    #hud-links a { color: #cfd9ee; font-size: 14px; text-decoration: none; padding: 7px 14px;
      border: 1px solid rgba(160,190,255,.35); border-radius: 999px; background: rgba(8,12,24,.5);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #hud-links a:hover { background: rgba(120,160,255,.15); }
    #room-hint { bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #8fa0c4;
      background: rgba(8,12,24,.55); padding: 8px 16px; border-radius: 999px;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); white-space: nowrap; }

    /* a letter from the mailbox */
    #letter-card { position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; background: rgba(4,6,14,.6);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: pointer; }
    #letter-card.on { display: flex; }
    .lt-paper { background: linear-gradient(160deg, #f4e9d3, #e6d3ac); color: #3a2a1c;
      max-width: 420px; width: calc(100vw - 48px); padding: 34px 34px 28px; border-radius: 4px;
      box-shadow: 0 24px 80px rgba(0,0,0,.7), inset 0 0 60px rgba(140,100,50,.12);
      transform: rotate(-.6deg); animation: ltin .5s ease; }
    @keyframes ltin { from { opacity: 0; transform: translateY(18px) rotate(-2deg); }
      to { opacity: 1; transform: translateY(0) rotate(-.6deg); } }
    .lt-paper em { display: block; font-style: normal; font-size: 12.5px; color: #8a6a44;
      letter-spacing: 2px; margin-bottom: 14px; }
    .lt-paper p { font-family: Georgia, "Songti SC", "Hiragino Mincho ProN", serif;
      font-size: 17px; line-height: 2; white-space: pre-wrap; }
    .lt-paper small { display: block; margin-top: 18px; font-size: 11.5px; color: #8a6a44; text-align: right; }
  </style>
</head>
<body>
  <div id="room-canvas"></div>
  <div class="hud" id="hud-name"><h1>the secret room</h1></div>
  <div class="hud" id="hud-links"><a href="/">&larr; slip back out</a></div>
  <div class="hud" id="room-hint">you found it · drag to drift · esc leaves quietly</div>
  <div id="letter-card">
    <div class="lt-paper">
      <em id="letter-no"></em>
      <p id="letter-text"></p>
      <small>— 小宇宙邮局</small>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/room/secret-main.js?v=11"></script>
</body>
</html>
